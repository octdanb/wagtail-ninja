services:
#  nginx:
#    image: nginx:latest
#    ports:
#      - "8000:80"
#    volumes:
#      - ./development/nginx/default.conf:/etc/nginx/conf.d/default.conf

  django:
    platform: linux/amd64
    hostname: wagtail-ninja-django
    build:
      dockerfile: Dockerfile
      target: development
    stdin_open: true
    tty: true
    command: bash
    entrypoint: sh -c
    depends_on:
      - postgres
      - redis
#      - nginx
    volumes:
      - ./wagtail_ninja/:/code/wagtail_ninja
      - ./development/:/code/development
    ports:
      - "8000:8000"

  frontend:
    platform: linux/amd64
    hostname: wagtail-ninja-frontend
    build:
      dockerfile: Dockerfile
      context: ./development/frontend/
      target: development
    stdin_open: true
    tty: true
#    depends_on:
#      - nginx
    volumes:
      - ./development/frontend:/code/frontend
    ports:
      - "3000:3000"

  postgres:
    hostname: wagtail-ninja-postgres
    image: postgres:16
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagtail_ninja}
      POSTGRES_USER: ${POSTGRES_USER:-wagtail_ninja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagtail_ninja}

  redis:
    hostname: wagtail-ninja-redis
    image: redis/redis-stack:latest

volumes:
  postgres:
